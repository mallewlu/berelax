<!doctype html>
<html lang="tr">
  <head>
    <meta name="robots" content="noindex, nofollow" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#080808" />
    <title>Bubble Karşılaştırma — Be Relax</title>
    <script type="module" crossorigin src="/bubble-karsilastir/assets/bubble-compare-PIHu6uxJ.js"></script>
    <link rel="stylesheet" crossorigin href="/bubble-karsilastir/assets/bubble-compare-BnbiVWhi.css">
  </head>
  <body>
    <main id="panels">
      <section class="panel" data-mode="live">
        <canvas aria-label="Bugünkü baloncuk"></canvas>
        <h2>Bugünkü</h2>
        <p class="cost">—</p>
      </section>
      <section class="panel" data-mode="off">
        <canvas aria-label="İnce dokusu kapalı baloncuk"></canvas>
        <h2>İnce doku kapalı</h2>
        <p class="cost">—</p>
      </section>
      <section class="panel" data-mode="baked">
        <canvas aria-label="Dokusu doğumda çizilen baloncuk"></canvas>
        <h2>Doku doğumda çizilir</h2>
        <p class="cost">—</p>
      </section>
      <section class="panel" data-mode="lean">
        <canvas aria-label="Yeni motorla çizilen baloncuk"></canvas>
        <h2>Yeni motor</h2>
        <p class="cost">—</p>
      </section>
    </main>
    <nav id="bar" aria-label="Karşılaştırma kontrolleri">
      <span id="status">yükleniyor…</span>
      <button id="previous" type="button" disabled>önceki</button>
      <button id="next" type="button">yeni baloncuk</button>
      <button id="measure" type="button">ölç</button>
    </nav>
  </body>
</html>
