<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#080808" />
    <title>Bubble Lab — Be Relax</title>
  </head>
  <body>
    <main id="stage">
      <div class="pane" id="pane-a"><canvas aria-label="Baloncuk"></canvas><span class="pane-label"></span></div>
      <div class="pane" id="pane-b" hidden><canvas aria-label="Karşılaştırılan baloncuk"></canvas><span class="pane-label"></span></div>
    </main>
    <p id="specimen" class="chip"></p>
    <section id="panel" aria-live="polite"></section>
    <nav id="modes" aria-label="Deneyler">
      <button type="button" data-mode="incele">incele</button>
      <button type="button" data-mode="oyla">oyla</button>
      <button type="button" data-mode="karsilastir">karşılaştır</button>
      <span class="modes-gap" aria-hidden="true"></span>
      <button type="button" data-tool="bubble-kimlik">kimlik</button>
      <button type="button" data-tool="bubble-galeri">galeri</button>
      <button type="button" data-tool="meetbubble">ölç</button>
    </nav>
    <div id="drawer" hidden>
      <button id="drawer-close" type="button" aria-label="Kapat">kapat</button>
      <iframe title="Lab aracı"></iframe>
    </div>
    <script type="module" src="/src/bubble/zoom-lab/lab.js"></script>
  </body>
</html>
